internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-postgresql:5432
  database: nextcloud
  user: nextcloud

  existingSecret:
    enabled: true
    secretName: postgres-secret
    passwordKey: password

postgresql:
  enabled: true

  global:
    postgresql:
      auth:
        username: nextcloud
        database: nextcloud
        existingSecret: postgres-secret
        secretKeys:
          adminPasswordKey: postgres-password
          userPasswordKey: password

  primary:
    nodeSelector:
      workload: database

    tolerations:
      - key: workload
        operator: Equal
        value: database
        effect: NoSchedule

    persistence:
      enabled: true
      storageClass: gp3-retain
      size: 100Gi

  metrics:
    enabled: true

redis:
  enabled: true
  auth:
    enabled: true
    existingSecret: redis-secret
    existingSecretPasswordKey: password

persistence:
  enabled: true
  storageClass: gp3-retain
  accessMode: ReadWriteOnce
  size: 10Gi

  nextcloudData:
    enabled: true
    storageClass: gp3-retain
    accessMode: ReadWriteOnce
    size: 50Gi

nextcloud:
  existingSecret:
    enabled: true
    secretName: nextcloud-secret
    usernameKey: username
    passwordKey: password