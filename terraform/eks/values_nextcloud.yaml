replicaCount: 2

deploymentLabels:
  app: nextcloud

podLabels:
  app: nextcloud

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: nextcloud
        topologyKey: kubernetes.io/hostname
        
persistence:
  enabled: true
  storageClass: nextcloud-efs
  accessMode: ReadWriteMany
  size: 10Gi

  nextcloudData:
    enabled: true
    storageClass: nextcloud-efs
    accessMode: ReadWriteMany
    size: 50Gi


internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-postgresql:5432
  database: nextcloud
  user: nextcloud

  existingSecret:
    enabled: true
    secretName: postgresql-secret
    usernameKey: postgresql-username
    passwordKey: postgresql-password


    
nextcloud:
  existingSecret:
    enabled: true
    secretName: nextcloud-secret
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password

  configs:
    logging.config.php: |-
      <?php
      $CONFIG = array (
        'log_type' => 'errorlog',
        'loglevel' => 2
      );

  phpConfigs:
    zz-memory_limit.ini: |-
      memory_limit=512M

  host: www.erben.cn
  
  securityContext:
    runAsUser: 33
    runAsGroup: 33
    runAsNonRoot: true
    readOnlyRootFilesystem: false

  podSecurityContext:
    fsGroup: 33
    runAsUser: 33
    runAsGroup: 33
    runAsNonRoot: true







postgresql:
  enabled: true
  
  global:
    postgresql:
      auth:
        username: nextcloud
        database: nextcloud
        existingSecret: postgresql-secret
        secretKeys:
          adminPasswordKey: postgresql-adminpassword
          userPasswordKey: postgresql-password

  primary:
    nodeSelector:
      workload: database
    labels:
      app: database
    podLabels:
      app: database
    networkPolicy:
      enabled: false
    podAntiAffinityPreset: hard
    priorityClassName: high-priority

    tolerations:
      - key: workload
        operator: Equal
        value: database
        effect: NoSchedule
    

    persistence:
      enabled: true
      storageClass: ebs-gp3
      size: 100Gi

  metrics:
    enabled: true



redis:
  enabled: true

  auth:
    enabled: true
    existingSecret: redis-secret
    existingSecretPasswordKey: redis-password

  networkPolicy:
    enabled: false

  replica:
    podLabels:
      app: redis

  master:
    podLabels:
      app: redis
    podAntiAffinityPreset: hard

  global:
    storageClass: ebs-gp3

