apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default

spec:
  template:
    spec:

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:

        - key: kubernetes.io/os
          operator: In
          values:
            - linux

        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64

        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand

        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            - "t"

        - key: karpenter.k8s.aws/instance-generation
          operator: In
          values:
            - "3"

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values:
            - small

  limits:
    cpu: "20"
    memory: 20Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m