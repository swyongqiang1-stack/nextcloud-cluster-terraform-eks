apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: redis-secret
  namespace: external-secrets

spec:
  refreshInterval: 1h0m0s

  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore

  target:
    name: redis-secret
    creationPolicy: Owner

  data:
    - secretKey: redis-password
      remoteRef:
        key: redis-secret
        property: password
