apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: nextcloud-secret
  namespace: nextcloud

spec:
  refreshInterval: 1h0m0s

  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore

  target:
    name: nextcloud-secret
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: nextcloud-secret
        property: username

    - secretKey: password
      remoteRef:
        key: nextcloud-secret
        property: password
